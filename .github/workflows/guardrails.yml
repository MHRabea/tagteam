# Dogfood: the repo's own shared tagteam constraints (.tagteam/constraints.json) checked on every pull request.
name: guardrails

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Runs this checkout's CLI, so the check always matches the code under review.
      - run: npm ci --ignore-scripts
      - run: node src/cli.js check --base "${{ github.event.pull_request.base.sha }}"

  # The published GitHub Action (action.yml at the repo root), the way other repos use it.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
