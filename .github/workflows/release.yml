# Publishes to npm when a version tag is pushed (git tag v0.1.0 && git push --tags).
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub, and npm attaches
# provenance that links the package to this workflow run. One-time setup on npmjs.com:
# package settings -> Trusted publishing -> GitHub Actions, this repo, workflow "release.yml".
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with Node may be older.
      - run: npm install -g npm@latest && npm --version
      - run: npm publish --access public --provenance --loglevel verbose
